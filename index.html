<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<title>World Database Lookup</title>
		<link href="world.css" type="text/css" rel="stylesheet" />
		<script src="world.js" type="text/javascript"></script>
	</head>

	<body>
		<header class="banner">
            <img src="worldmap.jpg" alt="World Map Banner" class="worldmap">
			<h1 class="banner-title">World Database Lookup</h1>
		</header>

		<main>
			<div id="controls">
				<label for="country">Country:</label>
				<input id="country" type="search" name="country" placeholder="Enter country name" />
				<div class="button-row">
					<button id="lookup">Lookup Country</button>
					<button id="lookup-cities">Lookup Cities</button>
				</div>
			</div>
			
			<div id="result">
			</div>
		</main>
	</body>
</html>
